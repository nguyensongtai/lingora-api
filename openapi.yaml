openapi: 3.0.3

info:
  title: Lingora API
  version: 0.1.0
  description: |
    API nội dung học tiếng Anh của Lingora.

    Route đọc là công khai. Route ghi cần access token JWT HS256 có claim
    `role: admin`.

servers:
  - url: http://localhost:8080/v1
    description: Máy dev
  - url: https://api.lingora.vn/v1
    description: Production

tags:
  - name: auth
    description: Đăng nhập, làm mới phiên và đăng xuất
  - name: courses
    description: Khoá học và bài học thuộc khoá

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Đăng nhập
      description: |
        Trả về access token JWT ngắn hạn và refresh token mờ. Sai email và sai
        mật khẩu cho cùng một lỗi để không lộ email nào đang tồn tại.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Cặp token mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/register:
    post:
      tags: [auth]
      summary: Tạo tài khoản học viên
      description: |
        Tạo tài khoản rồi đăng nhập luôn: trả về đúng cặp token như /auth/login.
        Vai trò luôn là `student`; không có cách nào tự nhận quyền admin.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tài khoản mới kèm cặp token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Làm mới phiên
      description: |
        Xoay vòng token: refresh token gửi lên bị thu hồi ngay khi cặp mới được
        cấp, nên mỗi refresh token chỉ dùng được đúng một lần.
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Cặp token mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      summary: Đăng xuất
      description: Thu hồi refresh token. Gọi nhiều lần vẫn thành công.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Đã đăng xuất
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/me:
    get:
      tags: [auth]
      summary: Thông tin tài khoản đang đăng nhập
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tài khoản đang đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses:
    get:
      tags: [courses]
      summary: Liệt kê khoá học
      description: |
        Phân trang keyset. Trang đầu không truyền `cursor`; các trang sau truyền
        lại nguyên văn `next_cursor` của trang trước. `next_cursor` bằng `null`
        nghĩa là đã hết dữ liệu.
      operationId: listCourses
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/LevelFilter'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang khoá học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      tags: [courses]
      summary: Tạo khoá học
      operationId: createCourse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
      responses:
        '201':
          description: Khoá học đã được tạo
          headers:
            Location:
              description: Đường dẫn tới khoá học vừa tạo
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'

    get:
      tags: [courses]
      summary: Lấy khoá học theo id
      operationId: getCourse
      responses:
        '200':
          description: Khoá học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [courses]
      summary: Cập nhật một phần khoá học
      description: |
        Field vắng mặt thì giữ nguyên. Riêng `cover_image_url` gửi `null` nghĩa
        là xoá ảnh bìa. Body rỗng bị từ chối.
      operationId: updateCourse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdate'
      responses:
        '200':
          description: Khoá học sau khi cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [courses]
      summary: Xoá mềm khoá học
      operationId: deleteCourse
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đã xoá
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/by-slug/{slug}:
    get:
      tags: [courses]
      summary: Lấy khoá học theo slug
      operationId: getCourseBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: ngu-phap-co-ban
      responses:
        '200':
          description: Khoá học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/{courseId}/lessons:
    parameters:
      - $ref: '#/components/parameters/CourseId'

    get:
      tags: [courses]
      summary: Liệt kê bài học của một khoá
      description: |
        Sắp xếp theo `position` tăng dần. Khoá không tồn tại trả về 404; khoá có
        thật nhưng chưa có bài trả về mảng rỗng.
      operationId: listCourseLessons
      responses:
        '200':
          description: Danh sách bài học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [courses]
      summary: Thêm bài học vào khoá
      description: Bài mới luôn đứng cuối; đổi thứ tự bằng endpoint order.
      operationId: createLesson
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCreate'
      responses:
        '201':
          description: Bài học đã được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/{courseId}/lessons/order:
    parameters:
      - $ref: '#/components/parameters/CourseId'

    put:
      tags: [courses]
      summary: Sắp xếp lại bài học trong khoá
      description: |
        Danh sách phải liệt kê đúng tập bài hiện có của khoá — thiếu, thừa hay
        trùng đều bị từ chối. Vị trí mới lấy từ chính thứ tự của mảng.
      operationId: reorderLessons
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonOrder'
      responses:
        '204':
          description: Đã sắp xếp lại
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lessons/{lessonId}:
    parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          x-go-type: string

    get:
      tags: [courses]
      summary: Lấy bài học theo id
      operationId: getLesson
      responses:
        '200':
          description: Bài học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [courses]
      summary: Cập nhật một phần bài học
      description: |
        position không sửa được ở đây; dùng endpoint order của khoá.
      operationId: updateLesson
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonUpdate'
      responses:
        '200':
          description: Bài học sau khi cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [courses]
      summary: Xoá mềm bài học
      operationId: deleteLesson
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đã xoá
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/progress:
    get:
      tags: [progress]
      summary: Đọc toàn bộ tiến độ của người đang đăng nhập
      description: |
        Trả một lần đủ dữ liệu để dựng mọi màn: tỉ lệ từng khoá, danh sách bài
        đã đánh dấu xong, và khoá được học gần đây nhất.
      operationId: getProgress
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tiến độ hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/progress/lessons/{lessonId}:
    parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          x-go-type: string

    put:
      tags: [progress]
      summary: Đánh dấu đã học xong một bài
      description: |
        Idempotent: gọi lại không dời mốc hoàn thành đã ghi lần đầu.
      operationId: markLessonComplete
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đã ghi nhận
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [progress]
      summary: Gỡ đánh dấu hoàn thành
      description: |
        Idempotent: gỡ một bài chưa từng đánh dấu vẫn trả 204.
      operationId: markLessonIncomplete
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đã gỡ
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token HS256 với claim `role: admin`."

  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string

    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CourseStatus'

    LevelFilter:
      name: level
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CourseLevel'

    PageSize:
      name: page_size
      in: query
      required: false
      description: Mặc định 20, trần 100.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100

    Cursor:
      name: cursor
      in: query
      required: false
      description: Chuỗi mờ lấy từ `next_cursor` của trang trước.
      schema:
        type: string

  schemas:
    UserRole:
      type: string
      enum: [admin, student]

    User:
      type: object
      required: [id, email, display_name, role, created_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        email:
          type: string
          format: email
          x-go-type: string
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
          x-go-type: string
        password:
          type: string
          format: password
          minLength: 12
          description: Tối thiểu 12 ký tự.
        display_name:
          type: string
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          x-go-type: string
        password:
          type: string
          format: password
          minLength: 12

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT HS256 dùng cho header Authorization.
        refresh_token:
          type: string
          description: Chuỗi mờ, chỉ dùng được một lần.
        expires_in:
          type: integer
          format: int64
          description: Số giây còn hiệu lực của access token.
        user:
          $ref: '#/components/schemas/User'

    CourseLevel:
      type: string
      description: Trình độ theo khung CEFR.
      enum: [A1, A2, B1, B2, C1, C2]

    CourseStatus:
      type: string
      description: Trạng thái xuất bản.
      enum: [draft, published]

    Course:
      type: object
      required: [id, slug, title, description, level, status, cover_image_url, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        slug:
          type: string
          example: ngu-phap-co-ban
        title:
          type: string
          example: Ngữ pháp cơ bản
        description:
          type: string
        level:
          $ref: '#/components/schemas/CourseLevel'
        status:
          $ref: '#/components/schemas/CourseStatus'
        cover_image_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CourseList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        next_cursor:
          type: string
          nullable: true
          description: Con trỏ cho trang kế tiếp; `null` nghĩa là đã hết.

    CourseCreate:
      type: object
      required: [slug, title, level]
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        level:
          $ref: '#/components/schemas/CourseLevel'
        status:
          $ref: '#/components/schemas/CourseStatus'
        cover_image_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true

    CourseUpdate:
      type: object
      minProperties: 1
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        level:
          $ref: '#/components/schemas/CourseLevel'
        status:
          $ref: '#/components/schemas/CourseStatus'
        cover_image_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true

    Lesson:
      type: object
      required: [id, course_id, slug, title, position, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        course_id:
          type: string
          format: uuid
          x-go-type: string
        slug:
          type: string
        title:
          type: string
        position:
          type: integer
          format: int32
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LessonCreate:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        title:
          type: string
          maxLength: 200

    LessonUpdate:
      type: object
      minProperties: 1
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        title:
          type: string
          maxLength: 200

    LessonOrder:
      type: object
      required: [lesson_ids]
      properties:
        lesson_ids:
          type: array
          minItems: 1
          description: Toàn bộ id bài của khoá, theo thứ tự mong muốn.
          items:
            type: string
            format: uuid
            x-go-type: string

    LessonList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_error
            - malformed_body
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - internal_error
        message:
          type: string
          description: Câu thông báo tiếng Việt, hiển thị được cho người dùng.
        details:
          type: object
          additionalProperties:
            type: string
          description: Lỗi theo từng field, chỉ có với validation_error.

    CourseProgress:
      type: object
      required: [course_id, lesson_count, completed_count]
      properties:
        course_id:
          type: string
          format: uuid
          x-go-type: string
        lesson_count:
          type: integer
          format: int64
          description: Tổng số bài chưa xoá của khoá — mẫu số của tỉ lệ.
        completed_count:
          type: integer
          format: int64

    DayActivity:
      type: object
      required: [date, completed_lessons]
      properties:
        date:
          type: string
          format: date
          x-go-type: string
        completed_lessons:
          type: integer
          format: int64

    ProgressSnapshot:
      type: object
      required:
        - courses
        - completed_lesson_ids
        - latest_course_id
        - today_xp
        - goal_xp
        - xp_per_lesson
        - streak_days
        - week
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CourseProgress'
        completed_lesson_ids:
          type: array
          description: Id các bài đã đánh dấu xong, mới nhất trước.
          items:
            type: string
            format: uuid
            x-go-type: string
        latest_course_id:
          type: string
          format: uuid
          nullable: true
          x-go-type: string
          description: Khoá được học gần đây nhất; `null` khi chưa học bài nào.
        today_xp:
          type: integer
          format: int64
          description: XP đã đạt hôm nay, tính theo giờ Việt Nam.
        goal_xp:
          type: integer
          format: int64
          description: Mục tiêu XP mỗi ngày.
        xp_per_lesson:
          type: integer
          format: int64
          description: |
            XP cho mỗi bài hoàn thành. Có mặt để phía trước cộng trừ được ngay
            khi người học bấm, mà không phải viết cứng lại con số của server.
        streak_days:
          type: integer
          format: int64
          description: |
            Số ngày học liên tiếp. Vẫn giữ nguyên khi hôm nay chưa học nhưng
            hôm qua có — người học còn nguyên hôm nay để nối tiếp.
        week:
          type: array
          description: Bảy ngày gần nhất, cũ trước mới sau; ngày không học vẫn có mặt.
          items:
            $ref: '#/components/schemas/DayActivity' 

  responses:
    BadRequest:
      description: Dữ liệu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Thiếu token hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Token hợp lệ nhưng không đủ quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Xung đột với dữ liệu đang có
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
