openapi: 3.0.3

info:
  title: Lingora API
  version: 0.1.0
  description: |
    API nội dung học tiếng Anh của Lingora.

    Route đọc là công khai. Route ghi cần access token JWT HS256 có claim
    `role: admin`.

servers:
  - url: http://localhost:8080/v1
    description: Máy dev
  - url: https://api.lingora.vn/v1
    description: Production

tags:
  - name: auth
    description: Đăng nhập, làm mới phiên và đăng xuất
  - name: courses
    description: Khoá học và bài học thuộc khoá

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Đăng nhập
      description: |
        Trả về access token JWT ngắn hạn và refresh token mờ. Sai email và sai
        mật khẩu cho cùng một lỗi để không lộ email nào đang tồn tại.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Cặp token mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/register:
    post:
      tags: [auth]
      summary: Tạo tài khoản học viên
      description: |
        Tạo tài khoản rồi đăng nhập luôn: trả về đúng cặp token như /auth/login.
        Vai trò luôn là `student`; không có cách nào tự nhận quyền admin.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Tài khoản mới kèm cặp token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/google:
    post:
      tags: [auth]
      summary: Đăng nhập bằng Google
      description: |
        Đổi authorization code của Google lấy phiên Lingora. `redirect_uri` phải
        khớp với cái đã dùng lúc chuyển hướng sang Google.

        Tài khoản Google đã gắn thì đăng nhập thẳng; chưa gắn mà email đã có
        tài khoản Lingora thì được gắn vào tài khoản đó; chưa có gì thì tạo mới
        với vai trò `student`. Email chưa được Google xác minh bị từ chối.

        Trả 503 khi máy chủ chưa được cấu hình GOOGLE_CLIENT_ID và
        GOOGLE_CLIENT_SECRET.
      operationId: signInWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        '200':
          description: Phiên đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: Đăng nhập Google chưa được bật trên máy chủ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Làm mới phiên
      description: |
        Xoay vòng token: refresh token gửi lên bị thu hồi ngay khi cặp mới được
        cấp, nên mỗi refresh token chỉ dùng được đúng một lần.
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Cặp token mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      summary: Đăng xuất
      description: Thu hồi refresh token. Gọi nhiều lần vẫn thành công.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Đã đăng xuất
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/me:
    get:
      tags: [auth]
      summary: Thông tin tài khoản đang đăng nhập
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tài khoản đang đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses:
    get:
      tags: [courses]
      summary: Liệt kê khoá học
      description: |
        Phân trang keyset. Trang đầu không truyền `cursor`; các trang sau truyền
        lại nguyên văn `next_cursor` của trang trước. `next_cursor` bằng `null`
        nghĩa là đã hết dữ liệu.
      operationId: listCourses
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/LevelFilter'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang khoá học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      tags: [courses]
      summary: Tạo khoá học
      operationId: createCourse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
      responses:
        '201':
          description: Khoá học đã được tạo
          headers:
            Location:
              description: Đường dẫn tới khoá học vừa tạo
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/order:
    put:
      tags: [courses]
      summary: Sắp xếp khoá học trong một bậc
      description: |
        `course_ids` phải là đúng tập khoá hiện có của bậc đó. Thiếu, thừa hay
        trùng đều bị từ chối, vì một lần sắp xếp thiếu khoá sẽ để lại những khoá
        mang thứ tự cũ lẫn vào giữa.
      operationId: reorderCourses
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseOrder'
      responses:
        '204':
          description: Đã sắp xếp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'

    get:
      tags: [courses]
      summary: Lấy khoá học theo id
      description: |
        Khoá `draft` chỉ admin đọc được; người khác nhận 404 chứ không phải 403,
        vì 403 đã xác nhận bản ghi đó tồn tại.
      operationId: getCourse
      responses:
        '200':
          description: Khoá học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [courses]
      summary: Cập nhật một phần khoá học
      description: |
        Field vắng mặt thì giữ nguyên. Riêng `cover_image_url` gửi `null` nghĩa
        là xoá ảnh bìa. Body rỗng bị từ chối.
      operationId: updateCourse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdate'
      responses:
        '200':
          description: Khoá học sau khi cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [courses]
      summary: Xoá mềm khoá học
      operationId: deleteCourse
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đã xoá
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/by-slug/{slug}:
    get:
      tags: [courses]
      summary: Lấy khoá học theo slug
      description: |
        Khoá `draft` chỉ admin đọc được; người khác nhận 404 chứ không phải 403,
        vì 403 đã xác nhận bản ghi đó tồn tại.
      operationId: getCourseBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: ngu-phap-co-ban
      responses:
        '200':
          description: Khoá học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/{courseId}/lessons:
    parameters:
      - $ref: '#/components/parameters/CourseId'

    get:
      tags: [courses]
      summary: Liệt kê bài học của một khoá
      description: |
        Sắp xếp theo `position` tăng dần. Khoá không tồn tại trả về 404; khoá có
        thật nhưng chưa có bài trả về mảng rỗng.

        Bài không có trạng thái riêng, nó thừa hưởng của khoá: bài thuộc khoá
        `draft` chỉ admin đọc được, người khác cũng nhận 404.
      operationId: listCourseLessons
      responses:
        '200':
          description: Danh sách bài học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [courses]
      summary: Thêm bài học vào khoá
      description: Bài mới luôn đứng cuối; đổi thứ tự bằng endpoint order.
      operationId: createLesson
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCreate'
      responses:
        '201':
          description: Bài học đã được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/{courseId}/lessons/order:
    parameters:
      - $ref: '#/components/parameters/CourseId'

    put:
      tags: [courses]
      summary: Sắp xếp lại bài học trong khoá
      description: |
        Danh sách phải liệt kê đúng tập bài hiện có của khoá — thiếu, thừa hay
        trùng đều bị từ chối. Vị trí mới lấy từ chính thứ tự của mảng.
      operationId: reorderLessons
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonOrder'
      responses:
        '204':
          description: Đã sắp xếp lại
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lessons/{lessonId}:
    parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          x-go-type: string

    get:
      tags: [courses]
      summary: Lấy bài học theo id
      description: |
        Bài không có trạng thái riêng, nó thừa hưởng của khoá: bài thuộc khoá
        `draft` chỉ admin đọc được, người khác nhận 404.
      operationId: getLesson
      responses:
        '200':
          description: Bài học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [courses]
      summary: Cập nhật một phần bài học
      description: |
        position không sửa được ở đây; dùng endpoint order của khoá.
      operationId: updateLesson
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonUpdate'
      responses:
        '200':
          description: Bài học sau khi cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [courses]
      summary: Xoá mềm bài học
      operationId: deleteLesson
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đã xoá
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/progress:
    get:
      tags: [progress]
      summary: Đọc toàn bộ tiến độ của người đang đăng nhập
      description: |
        Trả một lần đủ dữ liệu để dựng mọi màn: tỉ lệ từng khoá, danh sách bài
        đã đánh dấu xong, và khoá được học gần đây nhất.
      operationId: getProgress
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tiến độ hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/progress/lessons/{lessonId}:
    parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          x-go-type: string

    put:
      tags: [progress]
      summary: Đánh dấu đã học xong một bài
      description: |
        Idempotent: gọi lại không dời mốc hoàn thành đã ghi lần đầu.
      operationId: markLessonComplete
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đã ghi nhận
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [progress]
      summary: Gỡ đánh dấu hoàn thành
      description: |
        Idempotent: gỡ một bài chưa từng đánh dấu vẫn trả 204.
      operationId: markLessonIncomplete
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đã gỡ
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /vocabulary:
    get:
      tags: [vocabulary]
      summary: Danh sách từ vựng của một bài
      description: |
        Công cụ soạn nội dung, chỉ admin. Người học đọc từ của mình ở
        `/me/vocabulary`, nơi hàng đợi được lọc theo bài họ đã học xong.
      operationId: listVocabulary
      security:
        - bearerAuth: []
      parameters:
        - name: lesson_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: string
      responses:
        '200':
          description: Từ của bài, theo thứ tự position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyEntryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [vocabulary]
      summary: Thêm một từ vào bài
      operationId: createVocabularyEntry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyEntryCreate'
      responses:
        '201':
          description: Từ vừa thêm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /vocabulary/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          x-go-type: string

    patch:
      tags: [vocabulary]
      summary: Cập nhật một phần của từ
      operationId: updateVocabularyEntry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyEntryUpdate'
      responses:
        '200':
          description: Từ sau khi cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [vocabulary]
      summary: Xoá mềm một từ
      operationId: deleteVocabularyEntry
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đã xoá
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/vocabulary:
    get:
      tags: [vocabulary]
      summary: Từ vựng đã mở khoá của người đang đăng nhập
      description: |
        Chỉ gồm từ thuộc những bài người này đã đánh dấu hoàn thành. Chưa ôn lần
        nào thì `review` là `null` và `state` là `due`.
      operationId: listMyVocabulary
      security:
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VocabularyState'
      responses:
        '200':
          description: Danh sách thẻ từ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyCardList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/vocabulary/stats:
    get:
      tags: [vocabulary]
      summary: Bốn ô thống kê của màn Từ vựng
      operationId: getVocabularyStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thống kê
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/vocabulary/{entryId}/review:
    parameters:
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          x-go-type: string

    post:
      tags: [vocabulary]
      summary: Ghi nhận một lần ôn
      description: |
        Tính lịch tiếp theo theo SM-2. Từ thuộc bài chưa hoàn thành bị từ chối
        với 403.
      operationId: reviewVocabularyEntry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyReviewRequest'
      responses:
        '200':
          description: Lịch ôn sau lần này
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token HS256 với claim `role: admin`."

  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string

    StatusFilter:
      name: status
      in: query
      required: false
      description: |
        Chỉ có tác dụng với token admin. Người gọi khác luôn nhận `published`,
        và nếu xin `draft` thì nhận một trang rỗng.
      schema:
        $ref: '#/components/schemas/CourseStatus'

    LevelFilter:
      name: level
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CourseLevel'

    PageSize:
      name: page_size
      in: query
      required: false
      description: Mặc định 20, trần 100.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100

    Cursor:
      name: cursor
      in: query
      required: false
      description: Chuỗi mờ lấy từ `next_cursor` của trang trước.
      schema:
        type: string

  schemas:
    UserRole:
      type: string
      enum: [admin, student]

    User:
      type: object
      required: [id, email, display_name, role, created_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        email:
          type: string
          format: email
          x-go-type: string
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
          x-go-type: string
        password:
          type: string
          format: password
          minLength: 12
          description: Tối thiểu 12 ký tự.
        display_name:
          type: string
          maxLength: 100

    GoogleSignInRequest:
      type: object
      required: [code, redirect_uri]
      properties:
        code:
          type: string
          description: Authorization code Google trả về.
        redirect_uri:
          type: string
          description: Đúng redirect_uri đã dùng ở bước chuyển hướng.

    VocabularyState:
      type: string
      description: |
        `due` đến hạn ôn (kể cả từ chưa ôn lần nào), `learning` đang học,
        `mastered` khoảng cách ôn đã từ 21 ngày trở lên.
      enum: [due, learning, mastered]

    VocabularyEntry:
      type: object
      required: [id, lesson_id, word, ipa, meaning, example, example_vi, position, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        lesson_id:
          type: string
          format: uuid
          x-go-type: string
        word:
          type: string
          maxLength: 100
        ipa:
          type: string
          maxLength: 100
        meaning:
          type: string
          maxLength: 300
        example:
          type: string
          maxLength: 500
        example_vi:
          type: string
          maxLength: 500
        position:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VocabularyEntryCreate:
      type: object
      required: [lesson_id, word, meaning]
      properties:
        lesson_id:
          type: string
          format: uuid
          x-go-type: string
        word:
          type: string
          maxLength: 100
        ipa:
          type: string
          maxLength: 100
        meaning:
          type: string
          maxLength: 300
        example:
          type: string
          maxLength: 500
        example_vi:
          type: string
          maxLength: 500

    VocabularyEntryUpdate:
      type: object
      properties:
        word:
          type: string
          maxLength: 100
        ipa:
          type: string
          maxLength: 100
        meaning:
          type: string
          maxLength: 300
        example:
          type: string
          maxLength: 500
        example_vi:
          type: string
          maxLength: 500

    VocabularyEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VocabularyEntry'

    VocabularyReview:
      type: object
      required: [ease_factor, interval_days, repetitions, due_on, last_reviewed_at]
      properties:
        ease_factor:
          type: number
          format: double
        interval_days:
          type: integer
          format: int32
        repetitions:
          type: integer
          format: int32
        due_on:
          type: string
          format: date
          x-go-type: string
        last_reviewed_at:
          type: string
          format: date-time

    VocabularyCard:
      type: object
      required: [entry, level, state, familiarity, review]
      properties:
        entry:
          $ref: '#/components/schemas/VocabularyEntry'
        level:
          $ref: '#/components/schemas/CourseLevel'
        state:
          $ref: '#/components/schemas/VocabularyState'
        familiarity:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: Số đốt sáng trên vạch 5 đốt.
        review:
          allOf:
            - $ref: '#/components/schemas/VocabularyReview'
          nullable: true
          description: '`null` khi người học chưa ôn từ này lần nào.'

    VocabularyCardList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VocabularyCard'

    VocabularyStats:
      type: object
      required: [learned, due_today, mastered, new_this_week]
      properties:
        learned:
          type: integer
          format: int64
        due_today:
          type: integer
          format: int64
        mastered:
          type: integer
          format: int64
        new_this_week:
          type: integer
          format: int64

    VocabularyReviewRequest:
      type: object
      required: [grade]
      properties:
        grade:
          type: string
          enum: [remembered, forgot]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          x-go-type: string
        password:
          type: string
          format: password
          minLength: 12

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT HS256 dùng cho header Authorization.
        refresh_token:
          type: string
          description: Chuỗi mờ, chỉ dùng được một lần.
        expires_in:
          type: integer
          format: int64
          description: Số giây còn hiệu lực của access token.
        user:
          $ref: '#/components/schemas/User'

    CourseLevel:
      type: string
      description: Trình độ theo khung CEFR.
      enum: [A1, A2, B1, B2, C1, C2]

    CourseStatus:
      type: string
      description: Trạng thái xuất bản.
      enum: [draft, published]

    Course:
      type: object
      required: [id, slug, title, description, level, status, cover_image_url, position, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        slug:
          type: string
          example: ngu-phap-co-ban
        title:
          type: string
          example: Ngữ pháp cơ bản
        description:
          type: string
        level:
          $ref: '#/components/schemas/CourseLevel'
        status:
          $ref: '#/components/schemas/CourseStatus'
        cover_image_url:
          type: string
          format: uri
          nullable: true
        position:
          type: integer
          format: int32
          description: Thứ tự trong bậc, do người soạn đặt.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CourseList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        next_cursor:
          type: string
          nullable: true
          description: Con trỏ cho trang kế tiếp; `null` nghĩa là đã hết.

    CourseCreate:
      type: object
      required: [slug, title, level]
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        level:
          $ref: '#/components/schemas/CourseLevel'
        status:
          $ref: '#/components/schemas/CourseStatus'
        cover_image_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true

    CourseOrder:
      type: object
      required: [level, course_ids]
      properties:
        level:
          $ref: '#/components/schemas/CourseLevel'
        course_ids:
          type: array
          description: Toàn bộ id khoá của bậc đó, theo thứ tự mong muốn.
          items:
            type: string
            format: uuid
            x-go-type: string

    CourseUpdate:
      type: object
      minProperties: 1
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        level:
          $ref: '#/components/schemas/CourseLevel'
        status:
          $ref: '#/components/schemas/CourseStatus'
        cover_image_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true

    Lesson:
      type: object
      required: [id, course_id, slug, title, position, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        course_id:
          type: string
          format: uuid
          x-go-type: string
        slug:
          type: string
        title:
          type: string
        position:
          type: integer
          format: int32
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LessonCreate:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        title:
          type: string
          maxLength: 200

    LessonUpdate:
      type: object
      minProperties: 1
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        title:
          type: string
          maxLength: 200

    LessonOrder:
      type: object
      required: [lesson_ids]
      properties:
        lesson_ids:
          type: array
          minItems: 1
          description: Toàn bộ id bài của khoá, theo thứ tự mong muốn.
          items:
            type: string
            format: uuid
            x-go-type: string

    LessonList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_error
            - malformed_body
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - internal_error
        message:
          type: string
          description: Câu thông báo tiếng Việt, hiển thị được cho người dùng.
        details:
          type: object
          additionalProperties:
            type: string
          description: Lỗi theo từng field, chỉ có với validation_error.

    CourseProgress:
      type: object
      required: [course_id, lesson_count, completed_count]
      properties:
        course_id:
          type: string
          format: uuid
          x-go-type: string
        lesson_count:
          type: integer
          format: int64
          description: Tổng số bài chưa xoá của khoá — mẫu số của tỉ lệ.
        completed_count:
          type: integer
          format: int64

    DayActivity:
      type: object
      required: [date, completed_lessons]
      properties:
        date:
          type: string
          format: date
          x-go-type: string
        completed_lessons:
          type: integer
          format: int64

    ProgressSnapshot:
      type: object
      required:
        - courses
        - completed_lesson_ids
        - latest_course_id
        - today_xp
        - goal_xp
        - xp_per_lesson
        - streak_days
        - week
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CourseProgress'
        completed_lesson_ids:
          type: array
          description: Id các bài đã đánh dấu xong, mới nhất trước.
          items:
            type: string
            format: uuid
            x-go-type: string
        latest_course_id:
          type: string
          format: uuid
          nullable: true
          x-go-type: string
          description: Khoá được học gần đây nhất; `null` khi chưa học bài nào.
        today_xp:
          type: integer
          format: int64
          description: XP đã đạt hôm nay, tính theo giờ Việt Nam.
        goal_xp:
          type: integer
          format: int64
          description: Mục tiêu XP mỗi ngày.
        xp_per_lesson:
          type: integer
          format: int64
          description: |
            XP cho mỗi bài hoàn thành. Có mặt để phía trước cộng trừ được ngay
            khi người học bấm, mà không phải viết cứng lại con số của server.
        streak_days:
          type: integer
          format: int64
          description: |
            Số ngày học liên tiếp. Vẫn giữ nguyên khi hôm nay chưa học nhưng
            hôm qua có — người học còn nguyên hôm nay để nối tiếp.
        week:
          type: array
          description: Bảy ngày gần nhất, cũ trước mới sau; ngày không học vẫn có mặt.
          items:
            $ref: '#/components/schemas/DayActivity' 

  responses:
    TooManyRequests:
      description: Thử quá nhiều lần; header Retry-After cho biết phải chờ bao lâu.
      headers:
        Retry-After:
          description: Số giây còn phải chờ.
          schema:
            type: integer
            format: int32
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: Dữ liệu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Thiếu token hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Token hợp lệ nhưng không đủ quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Xung đột với dữ liệu đang có
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
