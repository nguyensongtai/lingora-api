name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # Integration test của tầng repo tự bỏ qua khi thiếu TEST_DATABASE_URL.
      # Dựng PostgreSQL 18 ở đây — cùng phiên bản với production vì schema dùng
      # uuidv7(), chỉ có từ 18 trở lên.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lingora
          POSTGRES_PASSWORD: lingora
          POSTGRES_DB: lingora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Test của limiter tự bỏ qua khi thiếu REDIS_URL. Dựng Redis ở đây để CI
      # chạy chúng thật thay vì lặng lẽ skip.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # Spec là nguồn sự thật: code sinh ra mà lệch spec thì CI phải đỏ.
      - name: Check generated api types are up to date
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          oapi-codegen -config oapi-codegen.yaml openapi.yaml
          git diff --exit-code -- internal/api/types.gen.go

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
        env:
          REDIS_URL: redis://localhost:6379/0
          TEST_DATABASE_URL: postgres://lingora:lingora@localhost:5432/lingora_test?sslmode=disable
