version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/query
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_interface: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type: "github.com/google/uuid.NullUUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
